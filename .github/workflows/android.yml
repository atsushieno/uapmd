name: build android

# Android build can be run manually or on the dedicated G-DaW development branch.
# The ARA backend also builds the unpublished aap-ara.

on:
  push:
    branches:
      - gusho/android-debug-apk

# Keep only the newest Android build for this branch; older builds are redundant.
concurrency:
  group: gdaw-android-${{ github.ref }}
  cancel-in-progress: true
  workflow_call:
    inputs:
      aap_core_ref:
        description: 'aap-core git ref to build against (branch / tag / sha)'
        required: false
        type: string
        default: 'main'
      aap_ara_ref:
        description: 'aap-ara git ref to build against (branch / tag / sha)'
        required: false
        type: string
        default: 'main'
  workflow_dispatch:
    inputs:
      aap_core_ref:
        description: 'aap-core git ref to build against (branch / tag / sha)'
        required: false
        type: string
        default: 'main'
      aap_ara_ref:
        description: 'aap-ara git ref to build against (branch / tag / sha)'
        required: false
        type: string
        default: 'main'

jobs:
  build-android:
    name: 'build uapmd-app Android artifacts'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: checkout uapmd
      uses: actions/checkout@v6
      with:
        submodules: recursive

    # android/.gitmodules declares external/aap-core, but android/ is not a
    # standalone repo, so the top-level checkout doesn't fetch it. Clone it
    # explicitly into the path that android/app/build.gradle.kts expects.
    - name: checkout aap-core
      uses: actions/checkout@v6
      with:
        repository: atsushieno/aap-core
        ref: ${{ inputs.aap_core_ref }}
        submodules: recursive
        path: android/external/aap-core

    - name: checkout aap-ara
      uses: actions/checkout@v6
      with:
        repository: atsushieno/aap-ara
        ref: ${{ inputs.aap_ara_ref }}
        submodules: recursive
        path: android/external/aap-ara

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: install Android NDK and CMake
      run: sdkmanager --install "platforms;android-36" "ndk;29.0.14206865" "cmake;4.1.2"

    - name: cache gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/external/aap-core/**/*.gradle*', 'android/external/aap-ara/**/*.gradle*') }}
        restore-keys: ${{ runner.os }}-gradle-android-

    # uapmd-app's native side pulls dependencies via CPM during the CMake
    # configure that gradle runs through externalNativeBuild.
    - name: cache CPM
      uses: actions/cache@v4
      with:
        path: ~/.cache/CPM/uapmd
        key: cpm-android-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: cpm-android-${{ runner.os }}-

    - name: publish aap-core to mavenLocal
      working-directory: android/external/aap-core
      run: ./gradlew --no-daemon publishToMavenLocal

    - name: publish aap-ara to mavenLocal
      working-directory: android/external/aap-ara
      run: ./gradlew --no-daemon :androidaudioplugin-ara:publishToMavenLocal

    - name: build uapmd-app
      working-directory: android
      env:
        CPM_SOURCE_CACHE: /home/runner/.cache/CPM/uapmd
      run: ./gradlew --no-daemon assembleDebug

    - name: upload debug APK
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: G-DaW-android-debug
        path: android/app/build/outputs/apk/debug/*.apk

    - name: upload build failure logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: uapmd-android-failure
        path: |
          android/app/build/reports
          android/app/build/outputs
          android/app/.cxx
